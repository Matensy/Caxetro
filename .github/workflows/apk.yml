name: APK

# Gera o APK de debug do Caxeta Royale e publica como artefato do workflow.
on:
  push:
    branches: ['**']
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner do ubuntu-latest ja traz a Android SDK com as licencas aceitas.
      # O android-actions/setup-android tenta instalar o pacote "tools", que a SDK
      # nao publica mais, e derruba o build.
      - name: Conferir a Android SDK do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Testes do motor de regras
        run: |
          node tools/test-rules.js
          node tools/test-needs.js

      - name: Montar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Conferir o tamanho
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          TAM=$(stat -c%s "$APK")
          echo "APK com $((TAM/1024)) KiB"
          if [ "$TAM" -gt 20971520 ]; then
            echo "APK passou de 20 MiB — conferir os assets." >&2
            exit 1
          fi

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: caxeta-royale-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
